<body>
<h1>tests/valid/factorial.b</h1>
<pre class="code"><span class="cmt">/* Recursive factorial - from the phase-1 handout */</span>
<span class="fn">factorial</span>: <span class="kw">function</span> <span class="ty">integer</span> ( <span class="var">n</span>: <span class="ty">integer</span> ) <span class="op">=</span> {
    <span class="kw">if</span> (<span class="var">n</span> <span class="op">&lt;=</span> <span class="lit">1</span>) <span class="kw">return</span> <span class="lit">1</span>;
    <span class="kw">return</span> <span class="var">n</span> <span class="op">*</span> <span class="fn">factorial</span>(<span class="var">n</span> <span class="op">-</span> <span class="lit">1</span>);
}

<span class="fn">main</span>: <span class="kw">function</span> <span class="ty">integer</span> () <span class="op">=</span> {
    <span class="kw">print</span> <span class="str">&quot;factorial(5) = &quot;</span>, <span class="fn">factorial</span>(<span class="lit">5</span>), <span class="str">&quot;\n&quot;</span>;
    <span class="kw">return</span> <span class="lit">0</span>;
}
</pre>
